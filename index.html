<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BKN vs PHI - Scorebar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --nets: #0c0c0e;
    --sixers: #1d428a;
    --bar-bg: rgba(18, 20, 24, 0.85);
    --strip-bg: rgba(10, 12, 15, 0.92);
    --center-bg: #3a3f45;
    --white: #ffffff;
    --accent: #e8c04a;
    --scale: 0.4;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; background: transparent;
    width: 100%; height: 100%; overflow: hidden;
    font-family: 'Saira Condensed', 'Arial Narrow', sans-serif;
  }
  #anchor { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); }
  #stage {
    transform: scale(var(--scale));
    transform-origin: bottom center;
    display: flex; flex-direction: column; align-items: center;
    filter: drop-shadow(0 8px 20px rgba(0,0,0,0.6));
  }
  .bar { display: flex; align-items: stretch; height: 88px; }
  .cap {
    display: flex; align-items: center; justify-content: center;
    min-width: 168px; padding: 0 22px;
    font-weight: 900; font-size: 68px; line-height: 1;
    letter-spacing: -1px; color: var(--white);
    text-shadow: 2px 2px 0 rgba(0,0,0,0.35), 0 3px 10px rgba(0,0,0,0.4);
  }
  .cap.left  { background: var(--nets); border-right: 1px solid rgba(255,255,255,0.12); }
  .cap.right { background: var(--sixers); }
  .score {
    display: flex; align-items: center; justify-content: center;
    background: var(--bar-bg); min-width: 128px;
    font-weight: 800; font-size: 70px; line-height: 1; color: var(--white);
    font-variant-numeric: tabular-nums; letter-spacing: -2px;
    text-shadow: 0 3px 8px rgba(0,0,0,0.45);
  }
  .score.flash { animation: scoreFlash 1.6s ease-out; }
  @keyframes scoreFlash {
    0%, 35% { color: var(--accent); transform: scale(1.12); }
    100%    { color: var(--white);  transform: scale(1); }
  }
  .center-wrap {
    display: flex; align-items: center; justify-content: center;
    background: var(--bar-bg); padding: 0 14px;
  }
  .center-box {
    background: var(--center-bg); border-radius: 6px;
    padding: 7px 16px 6px;
    display: flex; flex-direction: column; align-items: center;
    min-width: 92px;
  }
  .center-primary {
    font-weight: 800; font-size: 30px; line-height: 1; color: var(--white);
    font-variant-numeric: tabular-nums; letter-spacing: 0.5px;
  }
  .center-secondary {
    font-weight: 800; font-size: 17px; line-height: 1; color: var(--white);
    letter-spacing: 1px; margin-top: 3px; text-transform: uppercase;
  }
  .center-box.countdown { min-width: 156px; }
  .center-box.countdown .center-primary { font-size: 34px; }
  .center-box.countdown .center-secondary { font-size: 13px; letter-spacing: 2px; }
  .strip {
    background: var(--strip-bg);
    min-width: 380px;
    padding: 6px 20px 7px;
    display: flex; align-items: center; justify-content: center; gap: 18px;
    border-top: 2px solid rgba(255,255,255,0.10);
    border-radius: 0 0 4px 4px;
  }
  .strip-text {
    font-weight: 700; font-size: 20px; letter-spacing: 1px;
    color: var(--white); text-transform: uppercase; white-space: nowrap;
  }
  .strip-sub {
    font-weight: 700; font-size: 17px; letter-spacing: 1px;
    color: #9aa0a8; text-transform: uppercase; white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }
</style>
</head>
<body>

<div id="anchor">
  <div id="stage">
    <div class="bar">
      <div class="cap left">BKN</div>
      <div class="score" id="scoreLeft">0</div>
      <div class="center-wrap">
        <div class="center-box countdown" id="centerBox">
          <div class="center-primary" id="centerPrimary">--:--:--</div>
          <div class="center-secondary" id="centerSecondary">TIL TIPOFF</div>
        </div>
      </div>
      <div class="score" id="scoreRight">0</div>
      <div class="cap right">PHI</div>
    </div>

    <div class="strip" id="strip">
      <span class="strip-text" id="stripText">Barclays Center</span>
      <span class="strip-sub" id="stripSub"></span>
    </div>
  </div>
</div>

<script>
  var GAME_ID = "401901823";
  var SCOREBOARD_URL = "https://site.api.espn.com/apis/site/v2/sports/basketball/nba/scoreboard";
  var POLL_PREGAME_MS = 20000;
  var POLL_LIVE_MS = 8000;

  var DEMO_MODE = window.location.search.indexOf("demo=1") !== -1;

  var tipoffTime = new Date(Date.UTC(2026, 9, 8, 23, 30, 0));

  var scoreLeftEl = document.getElementById('scoreLeft');
  var scoreRightEl = document.getElementById('scoreRight');
  var centerBox = document.getElementById('centerBox');
  var centerPrimary = document.getElementById('centerPrimary');
  var centerSecondary = document.getElementById('centerSecondary');
  var stripTextEl = document.getElementById('stripText');
  var stripSubEl = document.getElementById('stripSub');

  var pollTimer = null;
  var currentPollInterval = 0;
  var lastGoodUpdate = null;
  var gamePhase = "pre";
  var previousLeftScore = null;
  var previousRightScore = null;

  function padNumber(value) {
    return String(value).padStart(2, '0');
  }

  function logStatus(messageText) {
    console.log("[scorebar] " + messageText);
  }

  function periodLabelFor(periodNumber) {
    if (periodNumber === 1) { return "1ST"; }
    if (periodNumber === 2) { return "2ND"; }
    if (periodNumber === 3) { return "3RD"; }
    if (periodNumber === 4) { return "4TH"; }
    if (periodNumber === 5) { return "OT"; }
    if (periodNumber > 5) { return (periodNumber - 4) + "OT"; }
    return "Q" + periodNumber;
  }

  function flashScore(element) {
    element.classList.remove('flash');
    void element.offsetWidth;
    element.classList.add('flash');
  }

  function applyScores(leftScore, rightScore) {
    if (previousLeftScore !== null && leftScore > previousLeftScore) {
      flashScore(scoreLeftEl);
    }
    if (previousRightScore !== null && rightScore > previousRightScore) {
      flashScore(scoreRightEl);
    }
    scoreLeftEl.textContent = leftScore;
    scoreRightEl.textContent = rightScore;
    previousLeftScore = leftScore;
    previousRightScore = rightScore;
  }

  function renderCountdown() {
    if (gamePhase !== "pre") {
      return;
    }
    var millisecondsRemaining = tipoffTime.getTime() - new Date().getTime();
    centerBox.classList.add('countdown');

    if (millisecondsRemaining <= 0) {                     // past tip, feed hasn't flipped yet
      centerPrimary.textContent = "TIPOFF";
      centerSecondary.textContent = "STARTING";
      return;
    }

    var totalSeconds = Math.floor(millisecondsRemaining / 1000);
    var hours = Math.floor(totalSeconds / 3600);
    var minutes = Math.floor((totalSeconds % 3600) / 60);
    var seconds = totalSeconds % 60;

    centerPrimary.textContent = padNumber(hours) + ":" + padNumber(minutes) + ":" + padNumber(seconds);
    centerSecondary.textContent = "TIL TIPOFF";
  }

  function renderLiveClock(displayClock, periodNumber, isHalftime) {
    centerBox.classList.remove('countdown');
    if (isHalftime === true) {
      centerPrimary.textContent = "HALF";
      centerSecondary.textContent = "TIME";
      return;
    }
    centerPrimary.textContent = displayClock;
    centerSecondary.textContent = periodLabelFor(periodNumber);
  }

  function buildQuarterSummary(leftLinescores, rightLinescores) {
    var parts = [];
    var count = Math.min(leftLinescores.length, rightLinescores.length);
    var startIndex = 0;
    if (count > 4) {
      startIndex = count - 4;
    }
    var i = startIndex;
    while (i < count) {
      parts.push(periodLabelFor(i + 1) + " " + leftLinescores[i] + "-" + rightLinescores[i]);
      i = i + 1;
    }
    return parts.join("   ");
  }

  function readLinescores(competitor) {
    var values = [];
    if (!competitor.linescores) {
      return values;
    }
    var i = 0;
    while (i < competitor.linescores.length) {
      values.push(Math.round(competitor.linescores[i].value));
      i = i + 1;
    }
    return values;
  }

  function setPollInterval(intervalMilliseconds) {
    if (intervalMilliseconds === currentPollInterval && pollTimer !== null) {
      return;
    }
    currentPollInterval = intervalMilliseconds;
    if (pollTimer !== null) {
      clearInterval(pollTimer);
    }
    pollTimer = setInterval(pollScoreboard, currentPollInterval);
  }

  function runDemo() {
    gamePhase = "in";
    logStatus("DEMO MODE - simulated, not live data");

    var netsScore = 42;
    var sixersScore = 38;
    var clockSeconds = 7 * 60 + 15;
    var hasScored = false;

    scoreLeftEl.textContent = netsScore;
    scoreRightEl.textContent = sixersScore;
    previousLeftScore = netsScore;
    previousRightScore = sixersScore;
    stripTextEl.textContent = "1ST 28-24   2ND 14-14";
    stripSubEl.textContent = "";

    setInterval(function () {
      if (clockSeconds > 0) {
        clockSeconds = clockSeconds - 1;
      }
      var minutes = Math.floor(clockSeconds / 60);
      var seconds = clockSeconds % 60;
      renderLiveClock(minutes + ":" + padNumber(seconds), 2, false);

      if (!hasScored && clockSeconds <= (7 * 60 + 9)) {
        hasScored = true;
        netsScore = netsScore + 3;
        applyScores(netsScore, sixersScore);
        stripTextEl.textContent = "1ST 28-24   2ND 17-14";
      }
    }, 1000);
  }

  function pollScoreboard() {
    fetch(SCOREBOARD_URL, { cache: "no-store" })
      .then(function (response) {
        if (!response.ok) {
          throw new Error("HTTP " + response.status);
        }
        return response.json();
      })
      .then(function (data) {
        var matchedEvent = null;
        var i = 0;
        while (i < data.events.length) {
          if (data.events[i].id === GAME_ID) {
            matchedEvent = data.events[i];
          }
          i = i + 1;
        }
        if (matchedEvent === null) {
          logStatus("game not in feed yet");
          return;
        }

        var competition = matchedEvent.competitions[0];
        var awayTeam = null;
        var homeTeam = null;
        var c = 0;
        while (c < competition.competitors.length) {
          if (competition.competitors[c].homeAway === "away") {
            awayTeam = competition.competitors[c];
          } else if (competition.competitors[c].homeAway === "home") {
            homeTeam = competition.competitors[c];
          }
          c = c + 1;
        }

        if (matchedEvent.date) {
          tipoffTime = new Date(matchedEvent.date);
        }

        var gameStatus = competition.status;
        var gameState = gameStatus.type.state;
        gamePhase = gameState;
        lastGoodUpdate = new Date();

        if (gameState === "pre") {
          renderCountdown();
          var venueName = "Barclays Center";
          if (competition.venue && competition.venue.fullName) {
            venueName = competition.venue.fullName;
          }
          stripTextEl.textContent = venueName;
          stripSubEl.textContent = tipoffTime.toLocaleTimeString('en-US',
            { hour: 'numeric', minute: '2-digit', timeZoneName: 'short' });
          setPollInterval(POLL_PREGAME_MS);
          logStatus("connected - waiting for tipoff");
          return;
        }

        applyScores(parseInt(homeTeam.score, 10), parseInt(awayTeam.score, 10));

        var quarterSummary = buildQuarterSummary(readLinescores(homeTeam), readLinescores(awayTeam));

        if (gameState === "post") {
          centerBox.classList.remove('countdown');
          centerPrimary.textContent = "FINAL";
          centerSecondary.textContent = "";
          stripTextEl.textContent = quarterSummary || "FINAL";
          stripSubEl.textContent = "";
          setPollInterval(POLL_PREGAME_MS);
          logStatus("final");
          return;
        }

        var isHalftime = false;
        if (gameStatus.type.name === "STATUS_HALFTIME") {
          isHalftime = true;
        }
        renderLiveClock(gameStatus.displayClock, gameStatus.period, isHalftime);

        stripTextEl.textContent = quarterSummary;
        stripSubEl.textContent = "";

        setPollInterval(POLL_LIVE_MS);
        logStatus("live - updated " + lastGoodUpdate.toLocaleTimeString());
      })
      .catch(function (error) {
        console.error("[scorebar] fetch failed:", error);
      });
  }

  if (DEMO_MODE) {
    renderCountdown();
    runDemo();
  } else {
    renderCountdown();
    setInterval(renderCountdown, 1000);
    pollScoreboard();
    setPollInterval(POLL_PREGAME_MS);
  }
</script>

</body>
</html>
