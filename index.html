<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NYJ vs TB - Scorebar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --jets: #115740;
    --bucs: #bd1c36;
    --bar-bg: rgba(18, 20, 24, 0.85);
    --strip-bg: rgba(10, 12, 15, 0.92);
    --center-bg: #3a3f45;
    --white: #ffffff;
    --accent: #e8c04a;

    /* ---- SIZE CONTROL: change this one number ---- */
    /* 1 = full size, 0.4 = current, 0.3 = even smaller */
    --scale: 0.4;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; background: transparent;
    width: 100%; height: 100%; overflow: hidden;
    font-family: 'Saira Condensed', 'Arial Narrow', sans-serif;
  }
  #anchor {
    position: fixed; left: 50%; bottom: 24px;
    transform: translateX(-50%);
  }
  #stage {
    transform: scale(var(--scale));
    transform-origin: bottom center;
    display: flex; flex-direction: column; align-items: center;
    filter: drop-shadow(0 8px 20px rgba(0,0,0,0.6));
  }
  .bar { display: flex; align-items: stretch; height: 88px; }

  .cap {
    display: flex; align-items: center; justify-content: center;
    min-width: 168px; padding: 0 22px;
    font-weight: 900; font-size: 68px; line-height: 1;
    letter-spacing: -1px; color: var(--white);
    text-shadow: 2px 2px 0 rgba(0,0,0,0.35), 0 3px 10px rgba(0,0,0,0.4);
  }
  .cap.left  { background: var(--jets); }
  .cap.right { background: var(--bucs); }

  .score {
    display: flex; align-items: center; justify-content: center;
    background: var(--bar-bg); min-width: 118px;
    font-weight: 800; font-size: 70px; line-height: 1; color: var(--white);
    font-variant-numeric: tabular-nums; letter-spacing: -2px;
    text-shadow: 0 3px 8px rgba(0,0,0,0.45);
  }
  .score.flash { animation: scoreFlash 1.6s ease-out; }
  @keyframes scoreFlash {
    0%, 35% { color: var(--accent); transform: scale(1.15); }
    100%    { color: var(--white);  transform: scale(1); }
  }

  .center-wrap {
    display: flex; align-items: center; justify-content: center;
    background: var(--bar-bg); padding: 0 14px;
  }
  .center-box {
    background: var(--center-bg); border-radius: 6px;
    padding: 7px 16px 6px;
    display: flex; flex-direction: column; align-items: center;
    min-width: 92px;
  }
  .center-primary {
    font-weight: 800; font-size: 30px; line-height: 1; color: var(--white);
    font-variant-numeric: tabular-nums; letter-spacing: 0.5px;
  }
  .center-secondary {
    font-weight: 800; font-size: 17px; line-height: 1; color: var(--white);
    letter-spacing: 1px; margin-top: 3px; text-transform: uppercase;
  }
  .center-box.countdown { min-width: 156px; }
  .center-box.countdown .center-primary { font-size: 34px; }
  .center-box.countdown .center-secondary { font-size: 13px; letter-spacing: 2px; }

  .strip {
    background: var(--strip-bg);
    min-width: 340px;
    padding: 6px 20px 7px;
    display: flex; align-items: center; justify-content: center; gap: 18px;
    border-top: 2px solid rgba(255,255,255,0.10);
    border-radius: 0 0 4px 4px;
  }
  .strip-text {
    font-weight: 700; font-size: 20px; letter-spacing: 1px;
    color: var(--white); text-transform: uppercase; white-space: nowrap;
  }
  .strip-sub {
    font-weight: 700; font-size: 17px; letter-spacing: 1px;
    color: #9aa0a8; text-transform: uppercase; white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }
  .poss {
    width: 0; height: 0;
    border-top: 6px solid transparent; border-bottom: 6px solid transparent;
    opacity: 0;
  }
  .poss.left  { border-right: 9px solid var(--accent); }
  .poss.right { border-left: 9px solid var(--accent); }
  .poss.on { opacity: 1; }

  .live-dot {
    display: inline-block; width: 8px; height: 8px; border-radius: 50%;
    background: #ff4d4d; box-shadow: 0 0 7px #ff4d4d;
    margin-right: 6px; vertical-align: middle;
    animation: pulse 1.4s ease-in-out infinite;
  }
  @keyframes pulse {
    0%,100% { opacity: 1; transform: scale(1); }
    50%     { opacity: 0.35; transform: scale(0.7); }
  }
</style>
</head>
<body>

<div id="anchor">
  <div id="stage">
    <div class="bar">
      <div class="cap left">NYJ</div>
      <div class="score" id="scoreLeft">0</div>
      <div class="center-wrap">
        <div class="center-box countdown" id="centerBox">
          <div class="center-primary" id="centerPrimary">--:--:--</div>
          <div class="center-secondary" id="centerSecondary">TIL KICKOFF</div>
        </div>
      </div>
      <div class="score" id="scoreRight">0</div>
      <div class="cap right">TB</div>
    </div>

    <div class="strip" id="strip">
      <span class="poss left" id="possLeft"></span>
      <span class="strip-text" id="stripText">MetLife Stadium</span>
      <span class="strip-sub" id="stripSub"></span>
      <span class="poss right" id="possRight"></span>
    </div>
  </div>
</div>

<script>
  var GAME_ID = "401873276";                                                    // TB @ NYJ, ESPN event id
  var SCOREBOARD_URL = "https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard";
  var POLL_PREGAME_MS = 30000;
  var POLL_LIVE_MS = 8000;

  var DEMO_MODE = window.location.search.indexOf("demo=1") !== -1;              // add ?demo=1 to test

  var kickoffTime = new Date(Date.UTC(2026, 7, 14, 23, 0, 0));                  // 7:00 PM ET fallback

  var scoreLeftEl = document.getElementById('scoreLeft');                       // NYJ (home)
  var scoreRightEl = document.getElementById('scoreRight');                     // TB (away)
  var centerBox = document.getElementById('centerBox');
  var centerPrimary = document.getElementById('centerPrimary');
  var centerSecondary = document.getElementById('centerSecondary');
  var stripTextEl = document.getElementById('stripText');
  var stripSubEl = document.getElementById('stripSub');
  var possLeftEl = document.getElementById('possLeft');
  var possRightEl = document.getElementById('possRight');

  var quarterLabels = { 1: "1ST", 2: "2ND", 3: "3RD", 4: "4TH", 5: "OT" };

  var pollTimer = null;
  var currentPollInterval = 0;
  var lastGoodUpdate = null;
  var gamePhase = "pre";
  var previousLeftScore = null;
  var previousRightScore = null;

  function padNumber(value) {
    return String(value).padStart(2, '0');
  }

  function logStatus(messageText) {                                             // console only, nothing on screen
    console.log("[scorebar] " + messageText);
  }

  function flashScore(element) {
    element.classList.remove('flash');
    void element.offsetWidth;                                                   // restart the animation
    element.classList.add('flash');
  }

  function applyScores(leftScore, rightScore) {
    if (previousLeftScore !== null && leftScore > previousLeftScore) {
      flashScore(scoreLeftEl);
    }
    if (previousRightScore !== null && rightScore > previousRightScore) {
      flashScore(scoreRightEl);
    }
    scoreLeftEl.textContent = leftScore;
    scoreRightEl.textContent = rightScore;
    previousLeftScore = leftScore;
    previousRightScore = rightScore;
  }

  function setPossession(side) {                                                // "left", "right", or "none"
    possLeftEl.classList.remove('on');
    possRightEl.classList.remove('on');
    if (side === "left") {
      possLeftEl.classList.add('on');
    } else if (side === "right") {
      possRightEl.classList.add('on');
    }
  }

  function renderCountdown() {
    if (gamePhase !== "pre") {
      return;
    }
    var millisecondsRemaining = kickoffTime.getTime() - new Date().getTime();
    if (millisecondsRemaining < 0) {
      millisecondsRemaining = 0;
    }
    var totalSeconds = Math.floor(millisecondsRemaining / 1000);
    var hours = Math.floor(totalSeconds / 3600);
    var minutes = Math.floor((totalSeconds % 3600) / 60);
    var seconds = totalSeconds % 60;

    centerBox.classList.add('countdown');
    centerPrimary.textContent = padNumber(hours) + ":" + padNumber(minutes) + ":" + padNumber(seconds);
    centerSecondary.textContent = "TIL KICKOFF";
  }

  function renderLiveClock(displayClock, periodNumber) {
    centerBox.classList.remove('countdown');
    var periodLabel = quarterLabels[periodNumber];
    if (!periodLabel) {
      periodLabel = "Q" + periodNumber;
    }
    centerPrimary.textContent = displayClock;
    centerSecondary.innerHTML = '<span class="live-dot"></span>' + periodLabel;
  }

  function setPollInterval(intervalMilliseconds) {
    if (intervalMilliseconds === currentPollInterval && pollTimer !== null) {
      return;
    }
    currentPollInterval = intervalMilliseconds;
    if (pollTimer !== null) {
      clearInterval(pollTimer);
    }
    pollTimer = setInterval(pollScoreboard, currentPollInterval);
  }

  /* ---- demo: 2nd quarter drive ending in a Jets touchdown ---- */
  function runDemo() {
    gamePhase = "in";
    logStatus("DEMO MODE - simulated, not live data");

    var jetsScore = 10;
    var bucsScore = 7;
    var clockSeconds = 8 * 60 + 24;
    var hasScored = false;

    scoreLeftEl.textContent = jetsScore;
    scoreRightEl.textContent = bucsScore;
    previousLeftScore = jetsScore;
    previousRightScore = bucsScore;
    setPossession("left");
    stripTextEl.textContent = "2ND & 7";
    stripSubEl.textContent = "NYJ 34";

    setInterval(function () {
      if (clockSeconds > 0) {
        clockSeconds = clockSeconds - 1;
      }
      var minutes = Math.floor(clockSeconds / 60);
      var seconds = clockSeconds % 60;
      renderLiveClock(minutes + ":" + padNumber(seconds), 2);

      if (!hasScored && clockSeconds <= (8 * 60 + 18)) {
        hasScored = true;
        jetsScore = jetsScore + 7;
        applyScores(jetsScore, bucsScore);
        stripTextEl.textContent = "TOUCHDOWN NYJ";
        stripSubEl.textContent = "";
        setPossession("none");
        setTimeout(function () {
          stripTextEl.textContent = "1ST & 10";
          stripSubEl.textContent = "TB 25";
          setPossession("right");
        }, 5000);
      }
    }, 1000);
  }

  function pollScoreboard() {
    fetch(SCOREBOARD_URL, { cache: "no-store" })
      .then(function (response) {
        if (!response.ok) {
          throw new Error("HTTP " + response.status);
        }
        return response.json();
      })
      .then(function (data) {
        var matchedEvent = null;
        var i = 0;
        while (i < data.events.length) {
          if (data.events[i].id === GAME_ID) {
            matchedEvent = data.events[i];
          }
          i = i + 1;
        }
        if (matchedEvent === null) {
          logStatus("game not in feed yet");
          return;
        }

        var competition = matchedEvent.competitions[0];
        var awayTeam = null;                                                    // TB
        var homeTeam = null;                                                    // NYJ
        var c = 0;
        while (c < competition.competitors.length) {
          if (competition.competitors[c].homeAway === "away") {
            awayTeam = competition.competitors[c];
          } else if (competition.competitors[c].homeAway === "home") {
            homeTeam = competition.competitors[c];
          }
          c = c + 1;
        }

        if (matchedEvent.date) {
          kickoffTime = new Date(matchedEvent.date);
        }

        var gameStatus = competition.status;
        var gameState = gameStatus.type.state;                                  // pre | in | post
        gamePhase = gameState;
        lastGoodUpdate = new Date();

        if (gameState === "pre") {
          renderCountdown();
          var venueName = "MetLife Stadium";
          if (competition.venue && competition.venue.fullName) {
            venueName = competition.venue.fullName;
          }
          stripTextEl.textContent = venueName;
          stripSubEl.textContent = kickoffTime.toLocaleTimeString('en-US',
            { hour: 'numeric', minute: '2-digit', timeZoneName: 'short' });
          setPossession("none");
          setPollInterval(POLL_PREGAME_MS);
          logStatus("connected - waiting for kickoff");
          return;
        }

        applyScores(parseInt(homeTeam.score, 10), parseInt(awayTeam.score, 10));

        if (gameState === "post") {
          centerBox.classList.remove('countdown');
          centerPrimary.textContent = "FINAL";
          centerSecondary.textContent = "";
          stripTextEl.textContent = "FINAL";
          stripSubEl.textContent = "";
          setPossession("none");
          setPollInterval(POLL_PREGAME_MS);
          logStatus("final");
          return;
        }

        renderLiveClock(gameStatus.displayClock, gameStatus.period);

        if (competition.situation) {
          var situation = competition.situation;
          var downText = situation.downDistanceText;
          if (!downText) {
            downText = situation.shortDownDistanceText;
          }
          if (!downText) {
            downText = "";
          }
          stripTextEl.textContent = downText;

          var fieldText = "";
          if (situation.possessionText) {
            fieldText = situation.possessionText;
          }
          if (situation.playClock !== undefined && situation.playClock !== null) {
            if (fieldText !== "") {
              fieldText = fieldText + "   :" + padNumber(situation.playClock);
            } else {
              fieldText = ":" + padNumber(situation.playClock);
            }
          }
          stripSubEl.textContent = fieldText;

          if (situation.possession === homeTeam.id) {
            setPossession("left");
          } else if (situation.possession === awayTeam.id) {
            setPossession("right");
          } else {
            setPossession("none");
          }
        } else {
          stripTextEl.textContent = "";
          stripSubEl.textContent = "";
          setPossession("none");
        }

        setPollInterval(POLL_LIVE_MS);
        logStatus("live - updated " + lastGoodUpdate.toLocaleTimeString());
      })
      .catch(function (error) {
        console.error("[scorebar] fetch failed:", error);
      });
  }

  if (DEMO_MODE) {
    renderCountdown();
    runDemo();
  } else {
    renderCountdown();
    setInterval(renderCountdown, 1000);
    pollScoreboard();
    setPollInterval(POLL_PREGAME_MS);
  }
</script>

</body>
</html>
